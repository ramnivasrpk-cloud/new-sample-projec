# Requires an installed Ingress controller. For AWS ALB, install AWS Load Balancer Controller
# and adjust annotations, DNS, certificate ARN, and hostname for your environment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-app
  namespace: devops-demo
spec:
  ingressClassName: nginx
  rules:
    - host: nodejs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-app
                port:
                  number: 80
